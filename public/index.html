<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Arle IT | Transfer</title>
    <style>
        /* Animacioni i sfondit */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        .container {
            /* Efekti Liquid Glass */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
        }

        h1 { margin-bottom: 25px; font-weight: 300; letter-spacing: 1px; }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover { background: rgba(255, 255, 255, 0.1); }

        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover { background: white; color: #23a6d5; }

        a { color: rgba(255, 255, 255, 0.8); text-decoration: none; margin-top: 15px; display: block; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Arle IT | Transfer</h1>
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <div class="upload-area">
                <p>Tërhiq & Lësho Skedarët këtu</p>
                <input type="file" name="file" multiple style="opacity: 0; cursor: pointer;">
            </div>
            <button type="submit">Ngarko Skedarët</button>
        </form>
        <a href="/files">Shiko Skedarët e ngarkuar</a>
    </div>

</body>
</html>
