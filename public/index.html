<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: flex-start;
            padding-left: 10%; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px;
            width: 450px; /* E bera me e madhe */
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            color: white;
        }

        h2 { margin-bottom: 30px; font-weight: 500; }

        /* Zonja e ngarkimit të skedarëve */
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.4);
            padding: 30px;
            text-align: center;
            border-radius: 20px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-zone:hover { background: rgba(255,255,255,0.1); }

        .input-group { margin-bottom: 20px; }
        input, textarea { 
            width: 100%; background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px; border-radius: 12px; color: white;
            box-sizing: border-box;
        }

        button {
            background: white; color: black; border: none;
            padding: 18px; width: 100%; border-radius: 50px;
            cursor: pointer; font-weight: bold; font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h2>Transferoni skedarët</h2>
        
        <!-- Shto skedarët -->
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <p>Klikoni për të zgjedhur skedarë ose tërhiqini këtu</p>
            <input type="file" id="fileInput" multiple style="display:none;">
        </div>

        <form>
            <div class="input-group">
                <input type="email" placeholder="Dërgo tek (Email)">
            </div>
            <div class="input-group">
                <input type="email" placeholder="Nga (Email)">
            </div>
            <div class="input-group">
                <textarea placeholder="Mesazh" rows="3"></textarea>
            </div>
            <button type="submit">Transfero</button>
        </form>
    </div>

</body>
</html>
