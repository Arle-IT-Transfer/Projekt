<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Arle IT | Pro Transfer</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --accent: #38bdf8; }
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: radial-gradient(circle at center, #1e293b, #0f172a); 
            font-family: 'Inter', sans-serif; color: white;
        }
        .app-card { 
            width: 420px; background: var(--glass); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center;
        }
        .page { display: none; } .page.active { display: block; }
        .drop-zone { border: 2px dashed rgba(255,255,255,0.2); padding: 30px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; }
        input { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; 
            background: rgba(255,255,255,0.1); color: white; box-sizing: border-box;
        }
        .btn-main { background: var(--accent); color: #0f172a; padding: 15px; border-radius: 12px; font-weight: 700; border: none; width: 100%; cursor: pointer; margin-top: 10px; }
        .nav-bar { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .nav-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding-bottom: 5px; }
        .nav-btn.active { color: white; border-bottom: 2px solid var(--accent); }
        .file-item { background: rgba(255,255,255,0.05); padding: 10px; margin: 5px 0; border-radius: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="app-card">
    <div id="view-upload" class="page active">
        <h2>Arle IT | Transfer</h2>
        <div class="drop-zone" id="dz">
            <p id="fileName">Tërhiq skedarët ose Kliko</p>
            <input type="file" id="fi" style="display:none">
        </div>
        <input type="email" id="emailTo" placeholder="Dërgo tek (Email)">
        <input type="email" id="emailFrom" placeholder="Nga (Email)">
        <button class="btn-main" onclick="uploadFile()">Dërgo Skedarin</button>
    </div>

    <div id="view-files" class="page">
        <h2>Skedarët e mi</h2>
        <div id="lista" style="max-height: 250px; overflow-y: auto;"></div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="show('view-upload', this)">Dërgo</button>
        <button class="nav-btn" onclick="show('view-files', this); fetchFiles()">Skedarët</button>
    </div>
</div>

<script>
    function show(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    document.getElementById('dz').onclick = () => document.getElementById('fi').click();
    
    async function uploadFile() {
        const file = document.getElementById('fi').files[0];
        const to = document.getElementById('emailTo').value;
        const from = document.getElementById('emailFrom').value;
        
        if(!file || !to) return alert("Mbush të dhënat!");
        
        const fd = new FormData();
        fd.append('file', file);
        fd.append('to', to);
        fd.append('from', from);
        
        await fetch('/upload', { method: 'POST', body: fd });
        alert('Skedari u dërgua me email!');
    }

    async function fetchFiles() {
        const res = await fetch('/api/files');
        const files = await res.json();
        document.getElementById('lista').innerHTML = files.map(f => `
            <div class="file-item">${f} <a href="/download/${f}" style="color:var(--accent)">Shkarko</a></div>
        `).join('');
    }
</script>

</body>
</html>
